
AllCops:
  Exclude:
    - gemfiles/vendor/**/*
    - vendor/**/*
  NewCops: enable
  SuggestExtensions: false

Lint/UnusedMethodArgument:
  Exclude:
    - app/models/spec_views/mail_message_extractor.rb

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ParameterLists:
  Exclude:
    - app/models/spec_views/base_matcher.rb

Metrics/PerceivedComplexity:
  Enabled: false

Naming/PredicateMethod:
  AllowedMethods:
    - match_challenger

Style/Documentation:
  Enabled: false
